---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    run: priority-low
  name: workload
spec:
  selector:
    matchLabels:
      app: priority-low
  template:
    metadata:
      labels:
        app: priority-low
    spec:
      containers:
        - name: minion
          resources:
            limits:
              cpu: '1'
              memory: 2400Mi
      priorityClassName: priority-low