apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    run: low-priority
  name: low-priority
spec:
  selector:
    matchLabels:
      app: low-priority
  template:
    metadata:
      labels:
        app: low-priority
    spec:
      containers:
      - image: ghcr.io/codekow/xmrig
        name: minion
        resources: {}
      restartPolicy: Always
      priorityClassName: low-priority
