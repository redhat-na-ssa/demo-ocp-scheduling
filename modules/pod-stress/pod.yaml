kind: Pod
apiVersion: v1
metadata:
  labels:
    run: workload
  name: workload
spec:
  restartPolicy: Never
  containers:
  - image: ghcr.io/colinianking/stress-ng
    name: minion
    command:
      - "/bin/bash"
      - "-c"
      - |
        #!/bin/bash

        # https://github.com/ColinIanKing/stress-ng

        stress-ng \
          --aggressive \
          --cpu -1 \
          --vm 1 \
          --vm-bytes 2000M \
          --timeout 3m \
          --metrics

    resources:
      limits:
        cpu: '1'
        memory: 2Gi
